name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
      - uses: oven-sh/setup-bun@v2

      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet Go
        run: go vet ./...
      - name: Test Go
        run: go test ./...
      - name: Build Go
        run: go build ./...

      - name: Install web dependencies
        working-directory: internal/web/ui
        run: bun install --frozen-lockfile
      - name: Test web UI
        working-directory: internal/web/ui
        run: bun run test
      - name: Build web UI
        working-directory: internal/web/ui
        run: bun run build
      # emptyOutDir + content hashes rewrite asset names, so stage first —
      # plain git diff misses untracked new hashed files.
      - name: Check committed UI dist is current
        run: |
          git add internal/web/ui/dist
          if ! git diff --cached --exit-code -- internal/web/ui/dist; then
            echo "::error::Committed internal/web/ui/dist is stale vs ui/src. Run: (cd internal/web/ui && bun install && bun run build) and commit dist/."
            exit 1
          fi
